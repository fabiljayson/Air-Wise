{% extends 'base.html' %}

{% block title %}GoTravel - Page Not Found{% endblock %}

{% block extra_css %}
<style>
    .error-page {
        text-align: center;
        padding: var(--space-xxl);
        max-width: 600px;
        margin: 0 auto;
    }
    .error-code {
        font-family: var(--font-family-display);
        font-size: 8rem;
        font-weight: 700;
        color: var(--color-primary);
        line-height: 1;
    }
    .error-title {
        font-size: 1.8rem;
        margin: var(--space-lg) 0 var(--space-sm);
        color: var(--color-primary-strong);
    }
    .error-msg {
        color: var(--color-primary);
        margin-bottom: var(--space-xxl);
        font-size: 1.1rem;
    }
    .error-btn {
        display: inline-block;
        padding: var(--space-md) var(--space-xxl);
        background: var(--color-primary);
        color: #ffffff;
        text-decoration: none;
        border-radius: var(--radius-md);
        font-weight: var(--font-weight-default);
        transition: background var(--motion-normal), transform var(--motion-normal), box-shadow var(--motion-normal);
    }
    .error-btn:hover {
        background: var(--color-primary-strong);
        transform: translateY(-2px);
        box-shadow: var(--shadow-depth);
    }
    .error-btn:focus-visible {
        outline: 3px solid var(--color-primary);
        outline-offset: 2px;
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-msg">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{% url 'home' %}" class="error-btn"><i class="fas fa-home"></i> Back to Home</a>
</div>
{% endblock %}
